name: Publish Docker image
on:
  workflow_dispatch:
  push:
    branches: ['main', 'stable-*', 'dev-*']
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image-name: ['mastodon', 'mastodon-streaming']
        platform: ['linux/amd64', 'linux/arm64']
        include:
          - image-name: 'mastodon'
            image-path: './Dockerfile'
            cache: True
          - image-name: 'mastodon-streaming'
            image-path: 'streaming/Dockerfile'
            cache: False
          - platform: linux/amd64
            os-with-arch: ubuntu-24.04
          - platform: linux/arm64
            os-with-arch: ubuntu-24.04-arm
    runs-on: ${{ matrix.os-with-arch }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          file: ${{ matrix.image-path }}
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.cache && 'type=gha' || '' }}
          cache-to: ${{ matrix.cache && 'type=gha,mode=max' || '' }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-${{ matrix.image-name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        image-name: ['mastodon', 'mastodon-streaming']
        include:
          - image-name: 'mastodon'
            image-path: './Dockerfile'
            cache: True
          - image-name: 'mastodon-streaming'
            image-path: 'streaming/Dockerfile'
            cache: False
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.image-name }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}:${{ steps.meta.outputs.version }}
